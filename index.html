<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MOAVI Desk</title>
    <script>
      // the light or dark theme before the first paint (src/theme.ts keeps it afterwards)
      try {
        var p = localStorage.getItem("moavi-theme");
        if (p === "system") p = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        else if (p !== "light" && p !== "dark") p = "light";   // light by default: the bright MOAVI Desk look
        document.documentElement.dataset.theme = p;
        var c = localStorage.getItem("moavi-color");   // the colour theme (src/theme.ts)
        if (c && /^(?:blue|mint|indigo|violet|rose|orange|green|graphite)$/.test(c)) document.documentElement.dataset.accent = c;
        var b = localStorage.getItem("moavi-backdrop");
        if (b && /^(?:[1-6]|moavi)$/.test(b)) document.documentElement.style.setProperty("--backdrop", 'url("/backgrounds/' + b + '.jpg")');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
