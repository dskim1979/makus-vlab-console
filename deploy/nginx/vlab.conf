# vlab-proxy: HTTPS in front of the console and the engine.
#
#   /            console (single-page app; unknown paths fall back to index.html)
#   /api/...     vlab-engine:5000 (plain HTTP inside the compose network, PEGAPROX_BEHIND_PROXY=1)
#                including the VNC websocket .../vncwebsocket, so one port (443) is all users need
#
# Host is passed through unchanged ($http_host, with the port the browser used): the engine's
# CSRF check compares the browser's Origin with it, and every write is refused otherwise.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    ssl_certificate     /etc/vlab/tls/tls.crt;
    ssl_certificate_key /etc/vlab/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    root /usr/share/nginx/html;
    client_max_body_size 64m;

    location /api/ {
        proxy_pass http://vlab-engine:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;     # consoles stay open for hours
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # no add_header inside these locations: one there would drop the server-level headers above
    location /assets/ {
        expires 30d;          # hashed file names: safe to keep
        try_files $uri =404;
    }

    location / {
        expires epoch;        # index.html must be fetched fresh after an upgrade
        try_files $uri /index.html;
    }
}
