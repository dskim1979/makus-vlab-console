# vlab-proxy: HTTPS in front of the console and the engine.
#
#   /            console (single-page app; unknown paths fall back to index.html)
#   /api/...     vlab-engine:5000 (plain HTTP inside the compose network, PEGAPROX_BEHIND_PROXY=1)
#                research data transfers (/api/vlab/me/data, datasets, one-time links) streamed, hours long
#                including the VNC websocket .../vncwebsocket, so one port (443) is all users need
#   /ide/<id>/   a user's JupyterLab / VS Code on a desktop or build VM (웹 IDE). Every request is
#                asked of the engine first (auth_request): the one-time link token, then a cookie
#                for that path; the engine answers the VM's address and the IDE's token, which go
#                upstream only - users never get the VM's port or the token
#
# Host is passed through unchanged ($http_host, with the port the browser used): the engine's
# CSRF check compares the browser's Origin with it, and every write is refused otherwise.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    ssl_certificate     /etc/vlab/tls/tls.crt;
    ssl_certificate_key /etc/vlab/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    root /usr/share/nginx/html;
    client_max_body_size 64m;

    location /api/ {
        proxy_pass http://vlab-engine:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Moavi-Ide-Subrequest "";   # only the /ide/ check below may say it is one
        proxy_read_timeout 3600s;     # consoles stay open for hours
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # 연구 데이터: uploads come in parts of 8 MiB (the engine's request limit is 10 MB) that resume,
    # downloads of tens of GB answer Range. Both stream through - nothing is spooled on the proxy's
    # disk - and may take hours.
    location ~ ^/api/vlab/(me/data|datasets)(/|$) {
        proxy_pass http://vlab-engine:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 16m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
    }

    # 포털 '파일' (내 데스크톱 MOAVI 폴더, 게스트 에이전트): 8 MiB upload parts, downloads streamed as read
    location ~ ^/api/vlab/me/desktops/[^/]+/files(/|$) {
        proxy_pass http://vlab-engine:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 16m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
    }

    # ISO 올리기 (가상머신 > ISO · 이미지): one request of several GB. The engine takes up to
    # 100 GB on an .../upload path and spools it to its own disk, so the proxy streams it through
    # instead of holding it a second time.
    location ~ ^/api/(vlab/admin/clusters/[^/]+/nodes/[^/]+/storage/[^/]+|clusters/[^/]+/datastores/[^/]+)/upload$ {
        proxy_pass http://vlab-engine:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 100g;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
    }

    # an approved export's one-time link: the token is in the path, so it stays out of the log
    location /api/vlab/data/links/ {
        proxy_pass http://vlab-engine:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 3600s;
        send_timeout 3600s;
        access_log off;
    }

    # 웹 IDE: the engine's check for every request under /ide/ (internal only)
    location = /_moavi_ide_auth {
        internal;
        proxy_pass http://vlab-engine:5000/api/vlab/ide/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Moavi-Ide-Subrequest 1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ide/ {
        auth_request /_moavi_ide_auth;
        auth_request_set $ide_upstream $upstream_http_x_ide_upstream;      # <VM address>:<port>
        auth_request_set $ide_token $upstream_http_x_ide_authorization;     # "token <the IDE's token>"
        auth_request_set $ide_cookie $upstream_http_x_ide_set_cookie;       # once, after the link
        error_page 401 403 = @ide_denied;
        proxy_pass http://$ide_upstream;     # no URI part: /ide/<id>/... is the IDE's own base path
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $ide_token;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;          # notebook kernels and the VS Code channel are websockets
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        client_max_body_size 512m;                       # notebook and file uploads
        access_log off;                                  # ?moavi_ide= link tokens would land in the log
        # an add_header here drops the server-level ones: they come again with the cookie
        add_header Set-Cookie $ide_cookie always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }

    location @ide_denied {
        return 302 /?ide=expired;    # the link was used or is old, or the IDE has ended: back to the portal
    }


    # no add_header inside these locations: one there would drop the server-level headers above
    location /assets/ {
        expires 30d;          # hashed file names: safe to keep
        try_files $uri =404;
    }

    location / {
        expires epoch;        # index.html must be fetched fresh after an upgrade
        try_files $uri /index.html;
    }
}
