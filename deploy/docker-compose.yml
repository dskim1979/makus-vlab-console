# MAKUS vLAB (working name) - one Linux host, one `docker compose up -d`. Install guide: README.md here.
#
# REMOVAL commit (apply only after real-cluster verification passes): the bundled Guacamole
# (guacd / guacamole / vlab-guac-key / vlab-guac) has been removed — Warpgate is now the web RDP/SSH.
# Turn Warpgate on (VLAB_WARPGATE=1) and switch web RDP to it (console: web_rdp_provider=warpgate)
# BEFORE applying this, or there is no web RDP. Rollback: git revert this commit.
#
#   vlab-proxy   console + HTTPS (443), passes /api to the engine   <- makus-vlab-console (this repo)
#   vlab-engine  vLAB engine, API only, no web UI (WEB_UI=0)          <- makus-vlab
#   warpgate     access gateway (bastion) for desktop RDP/SSH/VNC (VLAB_WARPGATE=1)
#   rdpgw        the gateway's devices route: RD Gateway for pools that need drives / printers / USB (VLAB_RDPGW=1)
#
# Built from the two repositories checked out side by side:
#   <dir>/makus-vlab            (engine)
#   <dir>/makus-vlab-console    (this repo; run compose from deploy/)
# or pulled ready-made by setting VLAB_ENGINE_IMAGE / VLAB_CONSOLE_IMAGE in .env.

name: vlab

services:
  vlab-engine:
    image: ${VLAB_ENGINE_IMAGE:-vlab-engine:dev}
    build:
      context: ../../makus-vlab
      args:
        WEB_UI: "0"
    restart: unless-stopped
    environment:
      PEGAPROX_BEHIND_PROXY: "1"            # plain HTTP behind vlab-proxy; VNC websocket on the same port
      PEGAPROX_HOST: "0.0.0.0"              # reachable from vlab-proxy (the port is not published)
      # X-Forwarded-For from vlab-proxy only: the compose network (Docker hands out 172.16.0.0/12 first).
      # A wider range would take users' own addresses (192.168.x, 10.x) for proxies and log every user as
      # the proxy; set VLAB_TRUSTED_PROXIES (one CIDR) if Docker gave the vlab network another range.
      PEGAPROX_TRUSTED_PROXIES: ${VLAB_TRUSTED_PROXIES:-172.16.0.0/12}
      PEGAPROX_HTTP_PORT: "-1"
      VLAB_PROFILE: ${VLAB_PROFILE:-}                       # optional: general | small_lab | university | research (first start only)
      VLAB_FEATURES: ${VLAB_FEATURES:-}                     # optional: fpga,gpuai
      VLAB_HOSTNAME: ${VLAB_HOSTNAME:-vlab.local}           # the gateway's address as shown in the console
      VLAB_HTTPS_PORT: ${VLAB_HTTPS_PORT:-443}
      VLAB_PUBLIC_URL: ${VLAB_PUBLIC_URL:-}                 # the console address desktops reach (portal 파일 fast path, SSO); empty = https://VLAB_HOSTNAME[:VLAB_HTTPS_PORT]
      # 보안 게이트웨이 첫 기동 자동 연결(VLAB_WARPGATE=1): 엔진이 관리자 비밀번호로 API 토큰을 만들어 봉인 저장한다.
      # 설정이 이미 있으면 건드리지 않는다. 주소·포트는 사용자에게 보이는 값(Warpgate가 게시한 호스트 포트)이다.
      VLAB_WARPGATE: ${VLAB_WARPGATE:-0}
      VLAB_WARPGATE_URL: https://${VLAB_WARPGATE_HOST:-${VLAB_HOSTNAME:-vlab.local}}:${VLAB_WARPGATE_HTTP_PORT:-8888}
      VLAB_WARPGATE_ADMIN_PASSWORD: ${VLAB_WARPGATE_ADMIN_PASSWORD:-}
      VLAB_WARPGATE_SSH_PORT: ${VLAB_WARPGATE_SSH_PORT:-2222}
      VLAB_WARPGATE_RDP_PORT: ${VLAB_WARPGATE_RDP_PORT:-3389}
      VLAB_WARPGATE_VNC_PORT: ${VLAB_WARPGATE_VNC_PORT:-5900}
      VLAB_WARPGATE_VERIFY_TLS: ${VLAB_WARPGATE_VERIFY_TLS:-0}       # Warpgate 기본 인증서는 자체 서명
      # 보안 게이트웨이 로그인을 MOAVI Desk 로그인으로(OIDC). 비우면 꺼짐 - 사용자가 Warpgate 에 따로 로그인해야 한다.
      VLAB_WARPGATE_OIDC_SECRET: ${VLAB_WARPGATE_OIDC_SECRET:-}
      VLAB_WARPGATE_OIDC_ISSUER: http://vlab-engine:5000/api/vlab/oidc   # Warpgate 가 엔진에 직접 묻는 주소(vlab 네트워크)
      # 보안 게이트웨이 · 장치 연결 방식(VLAB_RDPGW=1): 풀 정책 '장치 연결'인 풀의 .rdp 가 rdpgw 를 거친다.
      # 엔진이 1회용 토큰(5분, 그 데스크톱·그 PC 주소만)을 VLAB_RDPGW_KEY 로 서명한다 - rdpgw 와 같은 값.
      VLAB_RDPGW: ${VLAB_RDPGW:-0}
      VLAB_RDPGW_KEY: ${VLAB_RDPGW_KEY:-}
      VLAB_RDPGW_HOST: ${VLAB_RDPGW_HOST:-${VLAB_HOSTNAME:-vlab.local}:${VLAB_HTTPS_PORT:-443}}   # 사용자 PC 가 닿는 콘솔 주소
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - vlab-config:/app/config             # database (encrypted), master key, settings - back this up
      - vlab-logs:/app/logs
    expose:
      - "5000"
    networks: [vlab]

  vlab-proxy:
    image: ${VLAB_CONSOLE_IMAGE:-vlab-console:dev}
    build:
      context: ..
    restart: unless-stopped
    depends_on: [vlab-engine]
    environment:
      VLAB_HOSTNAME: ${VLAB_HOSTNAME:-vlab.local}   # name for the self-signed certificate
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "${VLAB_HTTPS_PORT:-443}:443"
      - "${VLAB_HTTP_PORT:-80}:80"
    volumes:
      - vlab-tls:/etc/vlab/tls              # tls.crt + tls.key; replace with your own certificate
    networks: [vlab]

  # --- Warpgate 접근 게이트웨이(bastion) — 선택(기본 꺼짐) --------------------------------
  # VLAB_WARPGATE=1 로 켠다. 모든 데스크톱 RDP/SSH/VNC를 Warpgate 하나로 중계해 대상 IP를
  # 숨기고 세션을 녹화하며, 접속할 때 비밀번호를 저장·전달하지 않는다(1회용 티켓). 이 제거 커밋에서는
  # Guacamole를 걷어냈으므로 웹 RDP/SSH는 Warpgate가 담당한다. 첫 기동 때 엔진이 관리자 API 토큰을
  # 만들어 스스로 연결한다(콘솔 > 플랫폼 설정 > 보안 게이트웨이에서 '연결됨' 확인).
  #
  # warpgate-setup: 첫 기동 때만 /data/warpgate.yaml 을 unattended-setup으로 만든다(이미
  # 있으면 건너뜀). 관리자 비밀번호는 VLAB_WARPGATE_ADMIN_PASSWORD(.env)에서 온다.
  warpgate-setup:
    image: ${VLAB_WARPGATE_IMAGE:-ghcr.io/dskim1979/warpgate:0.29.2-moavi9}   # MOAVI 빌드: 한국어 화면 + 한국어 키보드 RDP 수정 + SSO 자동 시작 + MOAVI 아이콘 + 웹 SSH 파일 패널 + 탭에 데스크톱 이름 (원본 warp-tech/warpgate:0.29.2)
    restart: "no"
    deploy:
      replicas: ${VLAB_WARPGATE:-0}         # 0: Warpgate off
    environment:
      WARPGATE_ADMIN_PASSWORD: ${VLAB_WARPGATE_ADMIN_PASSWORD:-}
      WG_EXTERNAL_HOST: ${VLAB_WARPGATE_HOST:-${VLAB_HOSTNAME:-vlab.local}}
      WG_OIDC_SECRET: ${VLAB_WARPGATE_OIDC_SECRET:-}
    volumes:
      - warpgate-data:/data
    # 0.29.2 unattended-setup에는 --if-config-exists 옵션이 없다 → 설정 파일이 있으면 셸에서 건너뛴다(재기동 안전).
    # VLAB_WARPGATE_OIDC_SECRET 이 있으면 MOAVI Desk 로그인(sso_providers: moavi-desk)을 한 번만 덧붙인다
    # (이미 있거나 다른 sso_providers 가 있으면 건드리지 않음 - 그때는 docs 의 항목을 손으로 넣는다).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -e;
        [ -f /data/warpgate.yaml ] || /usr/local/bin/warpgate --config /data/warpgate.yaml unattended-setup
        --data-path=/data --http-port=8888 --ssh-port=2222 --rdp-port=3389 --vnc-port=5900
        --record-sessions --external-host="$$WG_EXTERNAL_HOST";
        if [ -n "$$WG_OIDC_SECRET" ] && ! grep -q 'name: moavi-desk' /data/warpgate.yaml; then
        sed -i '/^sso_providers: \[\]$$/d' /data/warpgate.yaml;
        if grep -q '^sso_providers:' /data/warpgate.yaml; then echo 'sso_providers already set: add moavi-desk by hand'; else
        printf '%s\n' 'sso_providers:' '  - name: moavi-desk' '    label: MOAVI Desk' '    provider:'
        '      type: custom' '      client_id: warpgate' "      client_secret: $$WG_OIDC_SECRET"
        '      issuer_url: http://vlab-engine:5000/api/vlab/oidc' '      scopes: [email, profile]' >> /data/warpgate.yaml;
        echo 'MOAVI Desk sign-in added to warpgate.yaml'; fi; fi

  warpgate:
    image: ${VLAB_WARPGATE_IMAGE:-ghcr.io/dskim1979/warpgate:0.29.2-moavi9}
    restart: unless-stopped
    deploy:
      replicas: ${VLAB_WARPGATE:-0}         # 0: Warpgate off
    depends_on:
      warpgate-setup:
        condition: service_completed_successfully
    volumes:
      - warpgate-data:/data                 # DB(암호화)·호스트키·설정·세션 녹화 - 백업 대상
    command: ["run"]
    ports:
      - "${VLAB_WARPGATE_HTTP_PORT:-8888}:8888"   # 관리자 UI + 브라우저 RDP/SSH + 관리자 API(/@warpgate/admin/api)
      - "${VLAB_WARPGATE_SSH_PORT:-2222}:2222"    # native SSH (ticket-<secret>@host)
      - "${VLAB_WARPGATE_RDP_PORT:-3389}:3389"    # native RDP
      - "${VLAB_WARPGATE_VNC_PORT:-5900}:5900"    # native VNC
    networks: [vlab]                        # 데스크톱의 RDP/SSH/VNC 포트에 닿아야 한다

  # --- 보안 게이트웨이 · 장치 연결 방식 (rdpgw, Apache-2.0) — 선택(기본 꺼짐) ---------------
  # VLAB_RDPGW=1 과 VLAB_RDPGW_KEY(정확히 32자: openssl rand -hex 16) 로 켠다. Warpgate 는 녹화를 위해
  # RDP 를 풀었다 다시 맺으며 장치 채널(드라이브·프린터·USB)을 버린다. rdpgw 는 암호화된 RDP 를 그대로
  # 데스크톱까지 실어 나르므로 장치가 된다 - 대신 녹화되지 않는다(접속 기록은 감사 로그에 남는다).
  # 포트를 따로 열지 않는다: vlab-proxy(443)가 /remoteDesktopGateway/ 만 rdpgw 로 넘긴다. 토큰은 엔진이
  # 만들고(header 모드의 /connect 는 쓰지 않음 - 프록시 밖에서 닿지 않는다), rdpgw 는 그 토큰이 가리키는
  # 데스크톱으로만 보낸다.
  rdpgw:
    image: ${VLAB_RDPGW_IMAGE:-bolkedebruin/rdpgw@sha256:fd82a8616db4ad65cb8d8f2aab4ea582d447a8ace562cd3d1358e0c2aa1c3abd}   # latest 2026-08-18 (16cdaaf)
    restart: unless-stopped
    deploy:
      replicas: ${VLAB_RDPGW:-0}            # 0: 장치 연결 방식 꺼짐
    environment:
      RDPGW_SERVER__TLS: disable            # TLS 는 vlab-proxy 가 맡는다
      RDPGW_SERVER__PORT: "80"
      RDPGW_SERVER__GATEWAY_ADDRESS: https://${VLAB_RDPGW_HOST:-${VLAB_HOSTNAME:-vlab.local}:${VLAB_HTTPS_PORT:-443}}
      RDPGW_SERVER__AUTHENTICATION: header  # 게이트웨이 접속은 토큰만으로; /connect 는 아래 127.0.0.1 만 믿으므로 쓸 수 없다
      RDPGW_HEADER__USER_HEADER: X-Moavi-Unused
      RDPGW_HEADER__TRUSTED_PROXIES: 127.0.0.1/32
      RDPGW_SERVER__HOST_SELECTION: any     # 갈 곳은 토큰이 정한다(rdpgw 가 토큰의 데스크톱과 다르면 거절)
      RDPGW_SERVER__HOSTS: any              # 비어 있으면 rdpgw 가 시작하지 않는다(/connect 용 목록 - 쓰지 않음)
      RDPGW_SERVER__TRUSTED_PROXIES: ${VLAB_TRUSTED_PROXIES:-172.16.0.0/12}   # vlab-proxy 의 X-Forwarded-For (엔진과 같은 범위)
      RDPGW_CAPS__TOKEN_AUTH: "true"
      RDPGW_CAPS__REDIRECT_ALL: "true"      # 무엇을 넘길지는 풀 정책(.rdp)과 데스크톱 자체 설정이 정한다
      RDPGW_CAPS__IDLE_TIMEOUT: "0"
      RDPGW_SECURITY__PAA_TOKEN_SIGNING_KEY: ${VLAB_RDPGW_KEY:-}
      RDPGW_SECURITY__VERIFY_CLIENT_IP: "true"
      TZ: ${TZ:-Asia/Seoul}
    expose:
      - "80"
    networks: [vlab]                        # 데스크톱의 3389 에 닿아야 한다

networks:
  vlab:

volumes:
  vlab-config:
  vlab-logs:
  vlab-tls:
  warpgate-data:                            # Warpgate 데이터·설정·세션 녹화 (VLAB_WARPGATE=1)
